<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <!-- Max Facility Arena Icon -->
  <g transform="translate(50, 5)">
    <!-- Arena body (green) -->
    <path d="M0 35 Q50 0 100 35 L100 50 Q50 25 0 50 Z" fill="#4CAF50"/>
    <!-- Arena roof line (navy) -->
    <path d="M-2 36 Q50 -2 102 36" fill="none" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round"/>
    <!-- Horizontal grid lines on arena -->
    <path d="M5 40 Q50 20 95 40" fill="none" stroke="white" stroke-width="1" opacity="0.8"/>
    <path d="M3 45 Q50 23 97 45" fill="none" stroke="white" stroke-width="1" opacity="0.8"/>
    <!-- Vertical grid lines on arena -->
    <line x1="20" y1="33" x2="18" y2="48" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="35" y1="29" x2="33" y2="47" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="50" y1="27" x2="50" y2="46" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="65" y1="29" x2="67" y2="47" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="80" y1="33" x2="82" y2="48" stroke="white" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Underline below arena -->
  <line x1="48" y1="60" x2="152" y2="60" stroke="#1E3A5F" stroke-width="3"/>

  <!-- MAX text box (navy background) -->
  <rect x="30" y="68" width="60" height="28" fill="#1E3A5F"/>
  <!-- MAX text -->
  <text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">MAX</text>

  <!-- FACILITY text box (green background) -->
  <rect x="90" y="68" width="80" height="28" fill="#4CAF50"/>
  <!-- FACILITY text -->
  <text x="130" y="88" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">FACILITY</text>

  <!-- RINK REPORTS text below -->
  <text x="100" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    <tspan fill="#1E3A5F">RINK </tspan>
    <tspan fill="#4CAF50">REPORTS</tspan>
  </text>
</svg>
